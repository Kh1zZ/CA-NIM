name: CI

on:
  push:
    branches: [ "main", "debug", "dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-build-debug:
    name: Test & Build Debug
    # Mencegah duplikasi: jika branch internal di repo yang sama sudah dipicu oleh event 'push', skip event 'pull_request'
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Build Cache & Acceleration
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare Gradle Environment
        run: |
          chmod +x gradlew
          # Remove local developer machine JDK override if present
          sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Run Tests & Compile Debug APK (Parallel with Build Cache)
        run: ./gradlew testDebugUnitTest assembleDebug --build-cache --parallel --stacktrace

      - name: Validate Debug APK Output
        id: apk_check
        run: |
          VERSION_NAME=$(grep -E '^\s*versionName\s*=\s*"([^"]+)"' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          EXPECTED_APK="app/build/outputs/apk/debug/canim-debug-${VERSION_NAME}.apk"
          echo "Expected Debug APK: $EXPECTED_APK"
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found or empty: $EXPECTED_APK"
            ls -la app/build/outputs/apk/debug/ || true
            exit 1
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Debug APK verified successfully: $(basename "$EXPECTED_APK") ($(wc -c < "$EXPECTED_APK") bytes)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: canim-debug-${{ steps.apk_check.outputs.version_name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Publish Direct Debug APK Pre-release
        if: (github.ref_name == 'debug' || github.ref_name == 'dev') && github.repository == 'Kh1zZ/CA-NIM'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: "debug-build"
        run: |
          VERSION_NAME="${{ steps.apk_check.outputs.version_name }}"
          APK_FILE="app/build/outputs/apk/debug/canim-debug-${VERSION_NAME}.apk"

          echo "Publishing direct debug APK to GitHub Pre-release ($TAG_NAME)..."
          gh release delete "$TAG_NAME" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG_NAME" "$APK_FILE" \
            --title "CA'NIM Debug Build (${VERSION_NAME})" \
            --notes "### 🧪 CA'NIM Rolling Debug Build (${VERSION_NAME})

Branch: \`${{ github.ref_name }}\` • Commit: [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

> [!TIP]
> **Direct APK Download**: Klik langsung pada file **\`canim-debug-${VERSION_NAME}.apk\`** di bagian Assets bawah untuk mengunduh dan memasang di HP tanpa ekstrak zip!
" \
            --prerelease
          echo "Direct Debug APK pre-release published successfully!"
