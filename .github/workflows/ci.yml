name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build-debug:
    name: Test & Build Debug
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Build Cache & Acceleration
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare Gradle Environment
        run: |
          chmod +x gradlew
          # Remove local developer machine JDK override if present
          sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Validate CHANGELOG.md & Sequential Versioning
        run: |
          VERSION_NAME=$(grep -E '^\s*versionName\s*=\s*"([^"]+)"' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ ! -f "CHANGELOG.md" ]; then
            echo "::error::CHANGELOG.md file not found in repository root!"
            exit 1
          fi

          export TARGET_VER="$VERSION_NAME"
          python3 - << 'EOF'
          import re
          import sys
          import os

          target_version = os.environ.get("TARGET_VER", "")
          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              content = f.read()

          pattern = r'^## \[(v\d+\.\d+\.\d+)\]'
          versions = []
          for line in content.splitlines():
              m = re.match(pattern, line.strip())
              if m:
                  v_str = m.group(1)
                  parts = [int(x) for x in v_str[1:].split('.')]
                  versions.append((parts[0], parts[1], parts[2], v_str))

          if not versions:
              print("::error::No version headers (## [vX.Y.Z]) found in CHANGELOG.md!")
              sys.exit(1)

          logged_version_names = [v[3] for v in versions]
          if target_version not in logged_version_names:
              print(f"::error::Target version '{target_version}' not found in CHANGELOG.md! Add an entry before pushing.")
              sys.exit(1)

          for i in range(len(versions) - 1):
              curr = versions[i]
              prev = versions[i + 1]
              c_maj, c_min, c_patch = curr[0], curr[1], curr[2]
              p_maj, p_min, p_patch = prev[0], prev[1], prev[2]

              is_patch_step = (c_maj == p_maj and c_min == p_min and c_patch == p_patch + 1)
              is_minor_step = (c_maj == p_maj and c_min == p_min + 1 and c_patch == 0)
              is_major_step = (c_maj == p_maj + 1 and c_min == 0 and c_patch == 0)

              if not (is_patch_step or is_minor_step or is_major_step):
                  print(f"::error::Invalid version jump detected between {prev[3]} and {curr[3]} in CHANGELOG.md! Versions must be strictly sequential.")
                  sys.exit(1)

          print("CHANGELOG.md verification passed successfully: Version entry exists and follows sequential versioning without jumps.")
          EOF

      - name: Compile Debug APK (Parallel with Build Cache)
        run: ./gradlew assembleDebug --build-cache --parallel --stacktrace

      - name: Validate Debug APK Output
        id: apk_check
        run: |
          VERSION_NAME=$(grep -E '^\s*versionName\s*=\s*"([^"]+)"' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          EXPECTED_APK="app/build/outputs/apk/debug/canim-debug-${VERSION_NAME}.apk"
          echo "Expected Debug APK: $EXPECTED_APK"
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found or empty: $EXPECTED_APK"
            ls -la app/build/outputs/apk/debug/ || true
            exit 1
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Debug APK verified successfully: $(basename "$EXPECTED_APK") ($(wc -c < "$EXPECTED_APK") bytes)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: canim-debug-${{ steps.apk_check.outputs.version_name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
