name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build-debug:
    name: Test & Build Debug
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Build Cache & Acceleration
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare Gradle Environment
        run: |
          chmod +x gradlew
          # Remove local developer machine JDK override if present
          sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Compile Debug APK (Parallel with Build Cache)
        run: ./gradlew assembleDebug --build-cache --parallel --stacktrace

      - name: Validate Debug APK Output
        id: apk_check
        run: |
          VERSION_NAME=$(grep -E '^\s*versionName\s*=\s*"([^"]+)"' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          EXPECTED_APK="app/build/outputs/apk/debug/canim-debug-${VERSION_NAME}.apk"
          echo "Expected Debug APK: $EXPECTED_APK"
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found or empty: $EXPECTED_APK"
            ls -la app/build/outputs/apk/debug/ || true
            exit 1
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Debug APK verified successfully: $(basename "$EXPECTED_APK") ($(wc -c < "$EXPECTED_APK") bytes)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: canim-debug-${{ steps.apk_check.outputs.version_name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
