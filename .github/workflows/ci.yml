name: CI

on:
  push:
    branches: [ "main", "debug", "dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-build-debug:
    name: Test & Build Debug
    # Mencegah duplikasi: jika branch internal di repo yang sama sudah dipicu oleh event 'push', skip event 'pull_request'
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Build Cache & Acceleration
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare Gradle Environment
        run: |
          chmod +x gradlew
          # Remove local developer machine JDK override if present
          sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Run Tests & Compile Debug APK (Parallel with Build Cache)
        run: ./gradlew testDebugUnitTest assembleDebug --build-cache --parallel --stacktrace

      - name: Validate Debug APK Output
        id: apk_check
        run: |
          VERSION_NAME=$(grep -E '^\s*versionName\s*=\s*"([^"]+)"' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          EXPECTED_APK="app/build/outputs/apk/debug/canim-debug-${VERSION_NAME}.apk"
          echo "Expected Debug APK: $EXPECTED_APK"
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found or empty: $EXPECTED_APK"
            ls -la app/build/outputs/apk/debug/ || true
            exit 1
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Debug APK verified successfully: $(basename "$EXPECTED_APK") ($(wc -c < "$EXPECTED_APK") bytes)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: canim-debug-${{ steps.apk_check.outputs.version_name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Publish Direct Debug APK Pre-release
        if: (github.ref_name == 'debug' || github.ref_name == 'dev') && github.repository == 'Kh1zZ/CA-NIM'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: debug-build
          name: "CA'NIM Debug Build (${{ steps.apk_check.outputs.version_name }})"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/debug/canim-debug-*.apk
          body: |
            ### 🧪 CA'NIM Rolling Debug Build (${{ steps.apk_check.outputs.version_name }})

            Branch: `${{ github.ref_name }}` • Commit: [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            > [!TIP]
            > **Direct APK Download**: Unduh langsung file APK di bagian Assets bawah tanpa perlu mengekstrak zip!
